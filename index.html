<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportuna</title>

  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Opportuna</div>

    <nav>
      <a href="/">Home</a>
      <a href="/saved.html">Saved Jobs</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Find Fresh Job Opportunities in Real Time</h1>
    <p>Search, filter, and apply for the latest jobs instantly.</p>

    <!-- SEARCH BAR -->
    <div class="search-box">
      <input type="text" placeholder="Search jobs (e.g. Developer, Designer)" />
      <button>Search</button>
    </div>
  </section>

  <!-- FILTERS -->
  <section class="filters">
    <select>
      <option>All Locations</option>
      <option>Remote</option>
      <option>Nigeria</option>
      <option>USA</option>
    </select>

    <select>
      <option>Job Type</option>
      <option>Full-Time</option>
      <option>Part-Time</option>
      <option>Contract</option>
      <option>Internship</option>
    </select>

    <select>
      <option>Sort By</option>
      <option>Newest</option>
      <option>Oldest</option>
    </select>
  </section>

  <!-- JOB LISTINGS -->
  <section class="jobs-container">

    
  </section>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
