<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportuna</title>

  <link rel="stylesheet" href="/src/css/style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Opportuna</div>

    <nav>
      <a href="/">Home</a>
      <a href="/saved.html">Saved Jobs</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Find Fresh Job Opportunities in Real Time</h1>
    <p>Search, filter, and apply for the latest jobs instantly.</p>

    <!-- SEARCH BAR -->
    <div class="search-box">
  <input
    type="text"
    id="search-input"
    placeholder="Search jobs, companies, or locations..."
  />

  <button id="search-btn">
    Search
  </button>

  <button id="reset-filters" class="reset-btn">
  Reset Filters
</button>
</div>

  <!-- FILTERS -->
  <section class="filters">

  <!-- LOCATION -->
  <select id="location-filter">
    <option value="all">All Locations</option>
    <option value="remote">Remote</option>
    <option value="usa">USA</option>
    <option value="europe">Europe</option>
    <option value="worldwide">Worldwide</option>
  </select>

  <!-- JOB TYPE -->
  <select id="type-filter">
    <option value="all">Job Type</option>
    <option value="full-time">Full-Time</option>
    <option value="part-time">Part-Time</option>
    <option value="contract">Contract</option>
    <option value="internship">Internship</option>
  </select>

  <!-- SORT -->
  <select id="sort-filter">
    <option value="newest">Newest</option>
    <option value="oldest">Oldest</option>
  </select>

</section>

<!-- RECENTLY VIEWED JOBS -->
<section class="recent-section">
  <h2>Recently Viewed Jobs</h2>

  <div class="recent-jobs-container"></div>
</section>



  <!-- JOB LISTINGS -->
  <section class="jobs-container">

    
  </section>

  <script type="module" src="/src/js/main.js"></script>
  <div id="toast"></div>
</body>
</html>
